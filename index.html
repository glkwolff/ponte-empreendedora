<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ponte Empreendedora</title>
<meta name="description" content="Formulário passo a passo para mulheres migrantes montarem o plano do seu negócio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: caderno de trabalho. Trilha de passos à esquerda, a folha do formulário à direita; no celular, barra de progresso no topo. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#16232B; --muted:#56656C; --line:#D3DCD6;
  --accent:#0B6E63; --accent-ink:#FFFFFF; --accent-soft:#D5ECE7;
  --mark:#F5C842; --mark-soft:#FBEBB3;
  --warn:#A8402A; --warn-soft:#F7E0D8; --ok:#2C7A47; --ok-soft:#DCEFE2;
  --c-mat:#8A9BA3; --c-tempo:#0B6E63; --c-fix:#B9C7C0; --c-lucro:#E0A91B; --c-taxa:#C9705A;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171B; --surface:#172228; --ink:#E6EDEA; --muted:#9BAAB0; --line:#2A3A41;
  --accent:#4FC3B2; --accent-ink:#06211D; --accent-soft:#16352F;
  --mark:#F5C842; --mark-soft:#4A3D12;
  --warn:#F0937A; --warn-soft:#3B211A; --ok:#72CC90; --ok-soft:#173222;
  --c-mat:#6E8189; --c-tempo:#4FC3B2; --c-fix:#3D5058; --c-lucro:#F5C842; --c-taxa:#E08A73;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F171B; --surface:#172228; --ink:#E6EDEA; --muted:#9BAAB0; --line:#2A3A41;
  --accent:#4FC3B2; --accent-ink:#06211D; --accent-soft:#16352F;
  --mark:#F5C842; --mark-soft:#4A3D12;
  --warn:#F0937A; --warn-soft:#3B211A; --ok:#72CC90; --ok-soft:#173222;
  --c-mat:#6E8189; --c-tempo:#4FC3B2; --c-fix:#3D5058; --c-lucro:#F5C842; --c-taxa:#E08A73;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px;border-radius:4px}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.01em}
.brand svg{width:34px;height:20px}
.brand small{font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--muted);letter-spacing:0}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px;cursor:pointer;font-size:.85rem;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;font-size:.85rem}
.confirm .danger{background:var(--warn);color:var(--surface);border:0;border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:700}


.wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;max-width:1080px;margin:0 auto;padding:32px 20px 64px}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px)}
.rail button{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;cursor:pointer;color:var(--muted);font-size:.95rem}
.rail button:hover{background:var(--surface);color:var(--ink)}
.rail .n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.rail .done .n{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rail [aria-current="step"]{background:var(--surface);color:var(--ink);font-weight:700}
.rail [aria-current="step"] .n{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.progress{display:none}

.sheet{min-width:0;max-width:720px}
.eyebrow{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 6px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,4vw,2.5rem);line-height:1.1;letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance}
h1 span{background:linear-gradient(transparent 58%,var(--mark-soft) 58%,var(--mark-soft) 92%,transparent 92%);padding:0 .08em}
.lead{color:var(--muted);margin:0 0 28px;max-width:60ch}
form{display:grid;gap:22px}
.field{display:grid;gap:6px;min-width:0}
.lbl,legend{font-weight:700;font-size:1rem;padding:0}
.opt{font-weight:400;color:var(--muted);font-size:.85rem}
.hint{margin:0;color:var(--muted);font-size:.9rem}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
fieldset legend{margin-bottom:8px}
input[type="text"],textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;line-height:1.4}
textarea{min-height:88px;resize:vertical}
input[type="text"]:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.affix{display:flex;align-items:stretch;max-width:260px}
.affix span{display:grid;place-items:center;padding:0 12px;background:var(--bg);border:1.5px solid var(--line);color:var(--muted);font-size:.9rem;white-space:nowrap}
.affix .pre{border-right:0;border-radius:var(--r) 0 0 var(--r)}
.affix .suf{border-left:0;border-radius:0 var(--r) var(--r) 0}
.affix input{font-variant-numeric:tabular-nums}
.affix .pre + input{border-radius:0 var(--r) var(--r) 0}
.affix input:has(+ .suf){border-radius:var(--r) 0 0 var(--r)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-size:.95rem;cursor:pointer}
.chip input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip input:focus-visible + span{outline:3px solid var(--mark);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}

.nav{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:11px 22px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.secondary{background:none;border:1.5px solid var(--line)}
.btn.secondary:hover{border-color:var(--muted)}
.btn.mark{background:var(--mark);color:#16232B}

/* Calculadora de preço */
.calc{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;min-width:0}
.calc .big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.calc .big b{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.calc .big small{color:var(--muted)}
.bar{position:relative;display:flex;height:22px;border-radius:6px;overflow:visible;background:var(--bg)}
.bar i{display:block;height:100%}
.bar i:first-child{border-radius:6px 0 0 6px}
.bar i:last-of-type{border-radius:0 6px 6px 0}
.bar .pin{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--ink);border-radius:2px}
.bar .pin em{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-style:normal;font-size:.75rem;font-weight:700;white-space:nowrap}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 18px;margin:0;padding:0;list-style:none;font-size:.92rem}
.legend li{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.legend li span{display:flex;align-items:center;gap:8px;color:var(--muted)}
.legend li span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.note{margin:0;padding:10px 14px;border-radius:8px;font-size:.95rem}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.note.ok{background:var(--ok-soft)}
.note.info{background:var(--bg);color:var(--muted)}
.pill{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px}
.pill.warn{background:var(--warn);color:var(--surface)}
.pill.ok{background:var(--ok);color:var(--surface)}

/* SWOT */
.swot{display:grid;grid-template-columns:auto 1fr 1fr;gap:10px;min-width:0}
.swot .axis{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;align-self:center}
.quad{display:grid;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.quad label{font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.quad label small{display:block;font-family:var(--f-body);font-weight:400;font-size:.82rem;color:var(--muted)}
.quad textarea{min-height:150px;font-size:.95rem;border-style:dashed}
.quad.f{--q:var(--ok)} .quad.fr{--q:var(--warn)} .quad.o{--q:var(--accent)} .quad.a{--q:var(--c-lucro)}
.quad label::before,.quad h4::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--q);margin-right:.45em;vertical-align:.08em}
.swot-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.toast{font-size:.9rem;color:var(--muted)}

/* Plano final */
.doc{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,36px);display:grid;gap:30px;min-width:0}
.doc header h2{font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1.15;margin:0 0 4px;text-wrap:balance}
.doc header p{margin:0;color:var(--muted);font-size:.92rem}
.doc h3{font-family:var(--f-display);font-weight:800;font-size:1.15rem;margin:0 0 10px;text-wrap:balance}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.kpi span{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi b{font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.kpi small{font-size:.85rem;color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--mark);color:#16232B;font-weight:700;font-size:.9rem}
.doc .sub{margin:0 0 12px;color:var(--muted);font-size:.92rem;max-width:62ch}
dl.rows{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:8px 18px;margin:0}
dl.rows dt{color:var(--muted);font-size:.92rem}
dl.rows dd{margin:0;overflow-wrap:anywhere}
.doc .swot{grid-template-columns:1fr 1fr}
.doc .quad ul{margin:0;padding-left:18px;font-size:.95rem}
.doc .quad h4{margin:0;font-family:var(--f-display);font-size:1rem}
.empty{color:var(--muted)}
.foot{font-size:.85rem;color:var(--muted);margin-top:18px}

@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:20px;padding-top:20px}
  .rail{display:none}
  .progress{display:grid;gap:6px}
  .progress div{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .progress div i{display:block;height:100%;background:var(--accent)}
  .progress p{margin:0;font-size:.85rem;color:var(--muted);font-weight:700}
}
@media (max-width:520px){
  .swot{grid-template-columns:1fr}
  .swot .axis{display:none}
  .doc .swot{grid-template-columns:1fr}
  dl.rows{grid-template-columns:1fr;gap:2px}
  dl.rows dd{margin-bottom:10px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:in .25s ease-out}
  @keyframes in{from{transform:translateY(6px)}to{transform:none}}
}
</style>
</head>

const LS = 'ponte-plano-v2';
let d = {}, lang = 'pt', step = 0, confirming = false;
const $ = s => document.querySelector(s);
const main = $('#main');

function t(k, v){ let s = (T[lang] && T[lang][k]) ?? T.pt[k] ?? k; if(v) for(const n in v) s = s.split('{'+n+'}').join(v[n]); return s; }
function has(k){ return T[lang][k] !== undefined; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function num(k){ const n = parseFloat(String(d[k] ?? '').replace(/\s/g,'').replace(',', '.')); return isFinite(n) ? n : 0; }
const fmt = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const money = v => fmt.format(v);
const n1 = v => (Math.round(v*10)/10).toLocaleString('pt-BR');
const arr = k => Array.isArray(d[k]) ? d[k] : [];
const list = (k) => arr(k).map(o => t(o)).join(', ');

function load(){ try{ const r = JSON.parse(localStorage.getItem(LS) || 'null'); if(r && r.d){ d = r.d; lang = r.lang || 'pt'; step = r.step || 0; return true; } }catch(e){} return false; }
function save(){ try{ localStorage.setItem(LS, JSON.stringify({d, lang, step})); }catch(e){} }

/* ---------- campos ---------- */
function lab(id, o={}){ return `<label class="lbl" for="f-${id}">${t(id)}${o.opt ? ` <span class="opt">(${t('optional')})</span>` : ''}</label>`; }
function hint(id){ return has(id+'_h') ? `<p class="hint" id="h-${id}">${t(id+'_h')}</p>` : ''; }
function aria(id){ return has(id+'_h') ? ` aria-describedby="h-${id}"` : ''; }
function fText(id, o={}){ return `<div class="field">${lab(id,o)}${hint(id)}<input type="text" id="f-${id}" data-f="${id}" value="${esc(d[id])}"${aria(id)}></div>`; }
function fArea(id, o={}){ return `<div class="field">${lab(id,o)}${hint(id)}<textarea id="f-${id}" data-f="${id}"${aria(id)}>${esc(d[id])}</textarea></div>`; }
function fNum(id, o={}){
  return `<div class="field">${lab(id,o)}${hint(id)}<div class="affix">${o.pre ? `<span class="pre">${o.pre}</span>` : ''}<input type="text" inputmode="decimal" id="f-${id}" data-f="${id}" value="${esc(d[id])}"${aria(id)}>${o.suf ? `<span class="suf">${esc(o.suf)}</span>` : ''}</div></div>`;
}
function fRadio(id, opts){
  return `<fieldset${aria(id)}><legend>${t(id)}</legend>${hint(id)}<div class="chips">${opts.map(o =>
    `<label class="chip"><input type="radio" id="f-${id}-${o}" name="f-${id}" data-f="${id}" value="${o}"${d[id]===o?' checked':''}><span>${t(o)}</span></label>`).join('')}</div></fieldset>`;
}
function fChecks(id, opts){
  return `<fieldset${aria(id)}><legend>${t(id)}</legend>${hint(id)}<div class="chips">${opts.map(o =>
    `<label class="chip"><input type="checkbox" id="f-${id}-${o}" data-g="${id}" value="${o}"${arr(id).includes(o)?' checked':''}><span>${t(o)}</span></label>`).join('')}</div></fieldset>`;
}

/* ---------- cálculo de preço ---------- */
function calc(){
  const m = num('material'), h = num('horasUn'), vh = num('valorHora'), fx = num('fixos'), u = num('unidades');
  const tx = Math.min(Math.max(num('taxa'),0), 90) / 100, mg = Math.max(num('margem'),0) / 100;
  if(!(h > 0 && vh > 0)) return null;
  const fxU = u > 0 ? fx / u : 0, tempo = h * vh, custo = m + tempo + fxU, lucro = custo * mg;
  const exato = (custo + lucro) / (1 - tx), preco = Math.ceil(exato);
  return { m, h, u, tempo, fxU, custo, lucro, exato, preco, taxaV: preco - (custo + lucro), minimo: custo / (1 - tx),
    atual: num('precoAtual'), dispMes: num('horas') * 4.33, precisaMes: h * u, renda: tempo + lucro };
}
function status(c){ if(!c || !c.atual) return null; return c.atual < c.minimo ? 'baixo' : c.atual < c.preco * 0.95 ? 'meio' : 'ok'; }

function livePrice(){
  const box = $('#live'); if(!box) return;
  const c = calc();
  if(!c){ box.innerHTML = `<p class="note info">${t('r_incomplete')}</p>`; return; }
  const parts = [['r_mat',c.m,'--c-mat'],['r_tempo',c.tempo,'--c-tempo'],['r_fixos',c.fxU,'--c-fix'],['r_lucro',c.lucro,'--c-lucro'],['r_taxa',c.taxaV,'--c-taxa']];
  const scale = Math.max(c.preco, c.atual || 0);
  const st = status(c);
  let html = `<p class="eyebrow">${t('r_title')}${c.u ? '' : ''}</p>
    <div class="big"><b>${money(c.preco)}</b><small>${t('r_round',{x:money(c.exato)})} · ${t('r_min',{x:money(c.minimo)})}</small></div>
    <div class="bar" role="img" aria-label="${esc(parts.map(p=>t(p[0])+' '+money(p[1])).join(', '))}">
      ${parts.map(p => `<i style="width:${(p[1]/scale*100).toFixed(2)}%;background:var(${p[2]})"></i>`).join('')}
      ${c.atual ? `<span class="pin" style="left:calc(${(c.atual/scale*100).toFixed(2)}% - 1.5px)"><em>${t('r_hoje')}</em></span>` : ''}
    </div>
    <ul class="legend">${parts.map(p => `<li style="--c:var(${p[2]})"><span>${t(p[0])}</span><b>${money(p[1])}</b></li>`).join('')}</ul>`;
  if(st) html += `<p class="note ${st==='ok'?'ok':st==='baixo'?'warn':'info'}">${t('r_'+st,{a:money(c.atual), c:money(c.minimo)})}</p>`;
  if(c.u && num('horas')){
    const over = c.precisaMes > c.dispMes;
    html += `<p class="note ${over?'warn':'ok'}"><span class="pill ${over?'warn':'ok'}">${t(over?'r_cap_over':'r_cap_ok')}</span> ${t('r_cap',{u:n1(c.u), h:n1(c.precisaMes), d:n1(c.dispMes)})}</p>`;
  }
  box.innerHTML = html;
}

function metaCalc(){
  const c = calc(), r = num('renda');
  if(!c || !(c.renda > 0)) return {c:null};
  if(!r) return {c, r:0};
  const u = Math.ceil(r / c.renda), h = u * c.h;
  return {c, r, u, h, over: num('horas') > 0 && h > c.dispMes};
}
function liveMeta(){
  const box = $('#live'); if(!box) return;
  const m = metaCalc();
  if(!m.c){ box.innerHTML = `<p class="note info">${t('m_needprice')}</p>`; return; }
  if(!m.r){ box.innerHTML = `<p class="note info">${t('m_needrenda')}</p>`; return; }
  box.innerHTML = `<p class="eyebrow">${t('m_title')}</p>
    <div class="big"><b>${m.u}</b><small>${t('m_need',{u:m.u, p:esc(d.prodRef || '—'), h:n1(m.h)})}</small></div>
    ${num('horas') ? `<p class="note ${m.over?'warn':'ok'}">${t(m.over?'m_over':'m_fits',{d:n1(m.c.dispMes)})}</p>` : ''}`;
}

/* ---------- SWOT ---------- */
function swotForm(){
  const q = (k, cls) => `<div class="quad ${cls}"><label for="f-${k}">${t(k)}<small>${t(k+'_s')}</small></label><textarea id="f-${k}" data-f="${k}" aria-describedby="sw-hint">${esc(d[k])}</textarea></div>`;
  return `<div class="swot-actions"><button type="button" class="btn mark" id="suggest">${t('sw_suggest')}</button><span class="toast" id="toast" aria-live="polite"></span></div>
    <p class="hint" id="sw-hint">${t('sw_hint')}</p>
    <div class="swot">
      <span class="axis">${t('sw_in')}</span>${q('sw_f','f')}${q('sw_fr','fr')}
      <span class="axis">${t('sw_out')}</span>${q('sw_o','o')}${q('sw_a','a')}
    </div>`;
}
function suggestions(){
  const F=[], W=[], O=[], A=[], c = calc(), st = status(c), canais = arr('canais'), onde = arr('onde');
  if(d.diferencial) F.push(t('sg_dif',{x:String(d.diferencial).split(/[.\n]/)[0].trim()}));
  if(d.origem && String(d.origem).trim().length > 10) F.push(t('sg_exp'));
  if(canais.length) F.push(t('sg_canal',{x:list('canais')}));
  if(d.quem && String(d.quem).trim().length > 10) F.push(t('sg_publico'));
  if(d.idiomas && /[,e y]/.test(String(d.idiomas).trim())) F.push(t('sg_idiomas',{x:String(d.idiomas).trim()}));
  if(d.estagio === 'est_mensal') F.push(t('sg_mensal'));
  if(d.separa && d.separa !== 'sep_sim') W.push(t('sg_separa'));
  if(d.registro && d.registro !== 'reg_sim') W.push(t('sg_registro'));
  if(st === 'baixo') W.push(t('sg_preco'));
  if((c && c.u && num('horas') && c.precisaMes > c.dispMes) || d.emprego === 'emp_int') W.push(t('sg_tempo'));
  if(d.freq === 'fq_1' || (d.freq === undefined && !canais.length && d.canais !== undefined)) W.push(t('sg_divulga'));
  const faltam = onde.filter(o => !canais.includes(o) && o !== 'ch_comunidade');
  if(faltam.length) O.push(t('sg_onde',{x:faltam.map(o=>t(o)).join(', ')}));
  if(onde.includes('ch_comunidade') || arr('rede').includes('rd_migrantes')) O.push(t('sg_comun'));
  if(onde.includes('ch_feira') || arr('ajuda').includes('aj_feiras')) O.push(t('sg_feira'));
  if(arr('ajuda').length) O.push(t('sg_apoio'));
  if(onde.some(o => ['ch_insta','ch_tiktok','ch_whats'].includes(o))) O.push(t('sg_digital'));
  const rede = arr('rede');
  if(rede.includes('rd_ninguem') || (rede.length && !rede.includes('rd_empre') && !rede.includes('rd_ong'))) A.push(t('sg_rede'));
  if(d.mei && d.mei !== 'mei_sim') A.push(t('sg_formal'));
  if(canais.length && canais.every(o => ['ch_insta','ch_whats','ch_tiktok','ch_mkt'].includes(o))) A.push(t('sg_plataforma'));
  if(d.tipo === 'tipo_faco' || d.tipo === 'tipo_revendo') A.push(t('sg_industrial'));
  if(d.emprego === 'emp_int' || d.emprego === 'emp_meio') A.push(t('sg_sobrecarga'));
  if(d.docs !== undefined && (!arr('docs').includes('doc_cpf') || !arr('docs').includes('doc_rnm'))) A.push(t('sg_docs'));
  return {sw_f:F, sw_fr:W, sw_o:O, sw_a:A};
}
function applySuggestions(){
  const s = suggestions(); let n = 0;
  for(const k in s){
    const cur = String(d[k] || '').split('\n').map(x=>x.trim()).filter(Boolean);
    const low = cur.map(x=>x.toLowerCase());
    for(const line of s[k]) if(!low.includes(line.toLowerCase())){ cur.push(line); n++; }
    d[k] = cur.join('\n');
  }
  return n;
}

/* ---------- próximos passos ---------- */
function actions(){
  const a = [], c = calc(), st = status(c), m = metaCalc(), docs = arr('docs'), canais = arr('canais'), onde = arr('onde'), aj = arr('ajuda');
  const prod = d.prodRef || d.oque || '—';
  if(d.separa && d.separa !== 'sep_sim') a.push(t('a_separa'));
  if(d.registro && d.registro !== 'reg_sim') a.push(t('a_registro'));
  if(c) a.push(t(st === 'baixo' || st === 'meio' ? 'a_preco_up' : 'a_preco', {p:prod, x:money(c.preco)}));
  if((m.over) || (c && c.u && num('horas') && c.precisaMes > c.dispMes)) a.push(t('a_tempo'));
  if(d.docs !== undefined){
    const falta = ['doc_cpf','doc_rnm','doc_banco'].filter(x => !docs.includes(x));
    if(falta.length) a.push(t('a_docs',{x:falta.map(x=>t(x)).join(', ')}));
  }
  if(d.mei && d.mei !== 'mei_sim' || aj.includes('aj_mei')) a.push(t('a_mei'));
  const principal = canais[0] || onde.find(o => o !== 'ch_feira');
  if(principal && d.freq) a.push(t('a_div',{f:t('perweek',{x:t(d.freq).toLowerCase()}).replace(/^(todos os dias|todos los días) por semana$/i,'$1'), c:t(principal)}));
  const faltam = onde.filter(o => !canais.includes(o) && !['ch_feira','ch_comunidade','ch_bairro'].includes(o));
  if(faltam.length) a.push(t('a_onde',{x:faltam.map(o=>t(o)).join(', ')}));
  if(onde.includes('ch_feira') || aj.includes('aj_feiras')) a.push(t('a_feira'));
  if(aj.includes('aj_preco') || aj.includes('aj_redes')) a.push(t('a_sebrae'));
  if(aj.includes('aj_port')) a.push(t('a_port'));
  const rede = arr('rede');
  if(aj.includes('aj_rede') || rede.includes('rd_ninguem') || (rede.length && !rede.includes('rd_empre'))) a.push(t('a_rede'));
  return a;
}

/* ---------- plano ---------- */
function planModel(){
  const c = calc(), m = metaCalc(), v = x => (x && String(x).trim()) ? String(x).trim() : '';
  const origem = [v(d.pais), d.tempo ? t('since',{x:t(d.tempo).toLowerCase()}) : ''].filter(Boolean).join(', ');
  const tempoNeg = [num('horas') ? `${n1(num('horas'))} ${t('h_sem')}` : '', d.emprego ? `${t('emprego').replace(/\?$/,'')}: ${t(d.emprego)}` : ''].filter(Boolean).join(' · ');
  const lines = k => String(d[k] || '').split('\n').map(x=>x.trim()).filter(Boolean);
  return {
    title: v(d.negNome) || t('p_title'),
    by: v(d.nome),
    kpis: c ? [
      ['k_sug', money(c.preco), v(d.prodRef)],
      ['k_custo', money(c.custo), t('r_min',{x:money(c.minimo)})],
      ['k_renda', money(c.renda), `${t('r_tempo')} + ${t('r_lucro').toLowerCase()}`],
      ...(c.u ? [['k_horas', n1(c.precisaMes)+' h', `${n1(c.u)} un. · ${n1(c.dispMes)} h`]] : [])
    ] : [],
    actions: actions(),
    sections: [
      ['p_resumo', [['k_pessoa',v(d.nome)],['k_origem',origem],['k_cidade',v(d.cidade)],['k_idiomas',v(d.idiomas)],['k_negocio',v(d.negNome)],['k_oque',v(d.oque)],['k_tipo',d.tipo?t(d.tipo):''],['k_estagio',d.estagio?t(d.estagio):''],['k_dif',v(d.diferencial)],['k_tempo',tempoNeg]]],
      ['p_clientes', [['k_quem',v(d.quem)],['k_onde',list('onde')],['k_porque',v(d.porque)],['k_desejo',v(d.desejo)]]],
      ['p_preco', [['k_prod',v(d.prodRef)],['k_custo',c?money(c.custo):''],['k_min',c?money(c.minimo):''],['k_sug',c?money(c.preco):''],['k_atual',num('precoAtual')?money(num('precoAtual')):'']]],
      ['p_dinheiro', [['k_separa',d.separa?t(d.separa):''],['k_registro',d.registro?t(d.registro):''],['k_mei',d.mei?t(d.mei):''],['k_recebe',list('recebe')],['k_invest',d.invest!==undefined&&d.invest!==''?money(num('invest')):'']]],
      ['p_div', [['k_canais',list('canais')],['k_freq',d.freq?t('perweek',{x:t(d.freq).toLowerCase()}):''],['k_receio',v(d.receio)],['k_rede',list('rede')],['k_ajuda',list('ajuda')]]],
      ['p_metas', [['k_m3',v(d.meta3)],['k_m12',v(d.meta12)],['k_rendaM',num('renda')?money(num('renda'))+' '+t('u_mes'):''],['k_conta', m.u ? t('m_need',{u:m.u,p:v(d.prodRef)||'—',h:n1(m.h)}) : '']]]
    ],
    swot: [['sw_f','f',lines('sw_f')],['sw_fr','fr',lines('sw_fr')],['sw_o','o',lines('sw_o')],['sw_a','a',lines('sw_a')]]
  };
}
function planHTML(){
  const P = planModel(), date = new Date().toLocaleDateString(lang==='es'?'es':'pt-BR',{day:'numeric',month:'long',year:'numeric'});
  const rows = r => r.filter(x=>x[1]).length ? `<dl class="rows">${r.filter(x=>x[1]).map(([k,val]) => `<dt>${t(k)}</dt><dd>${esc(val)}</dd>`).join('')}</dl>` : `<p class="empty">—</p>`;
  return `<div class="nav" style="margin:0 0 20px;padding:0;border:0"><button type="button" class="btn primary" id="copy">${t('p_copy')}</button><span class="toast" id="toast" aria-live="polite"></span></div>
  <article class="doc" id="doc">
    <header><p class="eyebrow">${t('p_title')}</p><h2>${esc(P.title)}${P.by ? ` <span style="font-weight:600;color:var(--muted)">${t('p_of',{x:esc(P.by)})}</span>` : ''}</h2><p>${t('p_date',{x:date})}</p></header>
    ${P.kpis.length ? `<div class="kpis">${P.kpis.map(([k,b,s]) => `<div class="kpi"><span>${t(k)}</span><b>${esc(b)}</b>${s?`<small>${esc(s)}</small>`:''}</div>`).join('')}</div>` : ''}
    <section><h3>${t('p_passos')}</h3><p class="sub">${t('p_passos_s')}</p>
      ${P.actions.length ? `<ol class="steps">${P.actions.map(a=>`<li><span>${esc(a)}</span></li>`).join('')}</ol>` : `<p class="empty">${t('a_vazio')}</p>`}</section>
    ${P.sections.slice(0,3).map(([k,r]) => `<section><h3>${t(k)}</h3>${rows(r)}</section>`).join('')}
    <section><h3>${t('p_swot')}</h3><div class="swot">${P.swot.map(([k,cls,ls]) => `<div class="quad ${cls}"><h4>${t(k)}</h4>${ls.length?`<ul>${ls.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:'<p class="empty">—</p>'}</div>`).join('')}</div></section>
    ${P.sections.slice(3).map(([k,r]) => `<section><h3>${t(k)}</h3>${rows(r)}</section>`).join('')}
  </article>`;
}
function planText(){
  const P = planModel(), out = [];
  out.push(`${t('p_title').toUpperCase()}: ${P.title}${P.by ? ' ('+P.by+')' : ''}`, '');
  if(P.kpis.length){ P.kpis.forEach(([k,b,s]) => out.push(`${t(k)}: ${b}${s?' ('+s+')':''}`)); out.push(''); }
  out.push(t('p_passos').toUpperCase()); P.actions.forEach((a,i) => out.push(`${i+1}. ${a}`)); out.push('');
  const sec = ([k,r]) => { out.push(t(k).toUpperCase()); r.filter(x=>x[1]).forEach(([kk,val]) => out.push(`- ${t(kk)}: ${val}`)); out.push(''); };
  P.sections.slice(0,3).forEach(sec);
  out.push(t('p_swot').toUpperCase()); P.swot.forEach(([k,,ls]) => { out.push(t(k)+':'); ls.forEach(l => out.push('  • '+l)); }); out.push('');
  P.sections.slice(3).forEach(sec);
  return out.join('\n');
}

/* ---------- renderização ---------- */
function filled(s){ return s.keys.some(k => Array.isArray(d[k]) ? d[k].length : String(d[k] ?? '').trim() !== ''); }
function renderChrome(){
  document.documentElement.lang = lang === 'es' ? 'es' : 'pt-BR';
  $('#tagline').textContent = t('tagline');
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('#resetBox').innerHTML = confirming
    ? `<span class="confirm">${t('resetQ')} <button type="button" class="danger" id="resetYes">${t('resetYes')}</button><button type="button" class="ghost" id="resetNo">${t('cancel')}</button></span>`
    : `<button type="button" class="ghost" id="reset">${t('reset')}</button>`;
  $('#rail').innerHTML = STEPS.map((s,i) => `<li><button type="button" data-go="${i}" class="${filled(s)?'done':''}"${i===step?' aria-current="step"':''}><span class="n">${i+1}</span>${t(s.k)}</button></li>`).join('');
}
function render(focus){
  const s = STEPS[step], last = step === STEPS.length - 1;
  main.innerHTML = `
    <div class="progress"><p>${t('step')} ${step+1} ${t('of')} ${STEPS.length} · ${t(s.k)}</p><div><i style="width:${(step+1)/STEPS.length*100}%"></i></div></div>
    <p class="eyebrow" style="margin-top:8px">${t('step')} ${step+1} ${t('of')} ${STEPS.length}</p>
    <h1><span>${t(s.k)}</span></h1>
    <p class="lead">${t(s.l)}</p>
    ${s.plan ? planHTML() : `<form id="form" novalidate>${s.form()}</form>`}
    <div class="nav">
      ${step > 0 ? `<button type="button" class="btn secondary" data-go="${step-1}">← ${t('back')}</button>` : '<span></span>'}
      ${!last ? `<button type="button" class="btn primary" data-go="${step+1}">${step === STEPS.length-2 ? t('seePlan') : t('next')} →</button>` : ''}
    </div>
    <p class="foot">${t('saved')}</p>`;
  renderChrome();
  if(s.live) s.live();
  if(focus){ window.scrollTo({top:0}); main.querySelector('h1').setAttribute('tabindex','-1'); main.querySelector('h1').focus({preventScroll:true}); }
}
function go(i){ step = Math.max(0, Math.min(STEPS.length-1, i)); save(); render(true); }

function onField(e){
  const el = e.target;
  if(el.dataset.f){ if(el.type === 'radio'){ if(!el.checked) return; } d[el.dataset.f] = el.value; }
  else if(el.dataset.g){ d[el.dataset.g] = [...main.querySelectorAll(`[data-g="${el.dataset.g}"]:checked`)].map(x => x.value); }
  else return;
  save();
  const s = STEPS[step]; if(s.live) s.live();
  const btn = document.querySelector(`#rail [data-go="${step}"]`); if(btn) btn.classList.toggle('done', !!filled(s));
}
main.addEventListener('input', onField);
main.addEventListener('change', onField);
main.addEventListener('submit', e => e.preventDefault());

document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]'); if(g){ go(+g.dataset.go); return; }
  const l = e.target.closest('[data-lang]'); if(l){ lang = l.dataset.lang; save(); render(false); return; }
  const id = e.target.closest('button')?.id;
  if(id === 'reset'){ confirming = true; renderChrome(); $('#resetYes').focus(); }
  else if(id === 'resetNo'){ confirming = false; renderChrome(); }
  else if(id === 'resetYes'){ confirming = false; d = {}; step = 0; save(); render(true); }
  else if(id === 'suggest'){ const n = applySuggestions(); save(); render(false); $('#toast').textContent = n ? t('sw_added',{n}) : t('sw_none'); }
  else if(id === 'copy'){
    const txt = planText();
    try{ await navigator.clipboard.writeText(txt); $('#toast').textContent = t('p_copied'); }
    catch(err){ $('#toast').textContent = t('p_copyfail'); const r = document.createRange(); r.selectNodeContents($('#doc')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
  }
});

load();
render(false);
</script>
</body>
</html>
